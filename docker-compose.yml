services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  db:
    image: postgres:16.0
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOCKER_ENV: "True"
      DEBUG: "False"
    command:
      - sh
      - -c
      - >
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    expose:
      - "8000"
    volumes:
      - static_volume:/code/staticfiles
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
  celery:
    build: .
    restart: unless-stopped
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    environment:
      DOCKER_ENV: "True"
      DEBUG: "False"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
  celery-beat:
    build: .
    restart: unless-stopped
    command: celery -A config beat --loglevel=info --schedule=/var/lib/celery/celerybeat-schedule
    env_file:
      - .env
    environment:
      DOCKER_ENV: "True"
      DEBUG: "False"
    volumes:
      - celerybeat-data:/var/lib/celery
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static:ro
    depends_on:
      web:
        condition: service_started

volumes:
  redis_data:
  postgres_data:
  static_volume:
  celerybeat-data:
[tool.poetry]
name = "habits-cp5"
version = "0.1.0"
description = ""
authors = ["Vladimir Rastorguev <vmrmozg138@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
django = "~6.0.10"
djangorestframework = "^3.18.3"
djangorestframework-simplejwt = "^5.5.1"
pillow = "^13.0.0"
django-cors-headers = "^4.9.0"
drf-yasg = "^1.21.18"
celery = "^5.7.0"
eventlet = "^0.41.3"
redis = "^8.1.0"
python-dotenv = "^1.2.4"
django-celery-beat = "^2.9.0"
requests = "^2.34.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "coverage (>=7.17.2,<8.0.0)",
    "flake8 (>=7.5.0,<8.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "mypy (>=2.4.1,<3.0.0)"
]


[tool.black]
line-length = 88
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 88

